format = """
$directory$git_branch$git_status$fill$time
$character
"""

add_newline = false
command_timeout = 1000

[fill]
symbol = ' '

[character]
success_symbol = '[➜](bold green) '
error_symbol = '[✗](bold red) '
vimcmd_symbol = '[❮](bold yellow) '

[directory]
style = 'bold blue'
truncation_length = 3
truncate_to_repo = false
read_only = ' '
read_only_style = 'red'

[git_branch]
symbol = ' '
style = 'bold purple'
format = ' [$symbol$branch]($style)'

[git_status]
style = 'yellow'
format = '([ $all_status$ahead_behind]($style))'

[nodejs]
symbol = ' '
format = ' [$symbol($version )]($style)'

[bun]
symbol = '🥟 '
format = ' [$symbol($version )]($style)'

[ruby]
symbol = ' '
format = ' [$symbol($version )]($style)'

[package]
disabled = true

[gcloud]
disabled = true

[time]
disabled = false
style = 'dimmed white'
time_format = '%H:%M'
format = '[ $time]($style)'
